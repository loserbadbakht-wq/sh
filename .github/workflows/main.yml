name: Generate RSS, JSON, TTS and Translations

on:
  push:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: fetch-rss-convert
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # googletrans 4.0.2 is the latest official release and fixes the
          # 'Translator' object has no attribute 'raise_Exception' bug that
          # the old 4.0.0-rc1 pre-release hits on failure paths.
          python -m pip install edge-tts requests googletrans==4.0.2

      - name: Generate rss (Python scripts from pythons.json)
        env:
          BA: ${{ secrets.BA }}
          BI: ${{ secrets.BI }}
        run: |
          python - <<'PYEOF'
          import json, os, subprocess, sys

          if not os.path.exists('pythons.json'):
              print("❌ pythons.json not found in repository root. Aborting.")
              sys.exit(1)

          with open('pythons.json', 'r', encoding='utf-8') as f:
              entries = json.load(f)

          if not isinstance(entries, list) or not entries:
              print("❌ pythons.json must contain a non-empty array of "
                    "{ script, env? } objects.")
              sys.exit(1)

          failed = []

          for i, entry in enumerate(entries):
              if not isinstance(entry, dict) or 'script' not in entry:
                  print(f"❌ pythons.json entry #{i} missing 'script' key.")
                  sys.exit(1)

              script = entry['script']
              env_map = entry.get('env', {}) or {}

              env = os.environ.copy()
              for env_var, secret_name in env_map.items():
                  secret_val = os.environ.get(secret_name)
                  if secret_val is None:
                      print(f"❌ Missing secret env '{secret_name}' "
                            f"(required as '{env_var}' for {script}).")
                      sys.exit(1)
                  env[env_var] = secret_val

              print(f"\n▶ Running {script}")
              result = subprocess.run([sys.executable, script], env=env)
              if result.returncode != 0:
                  print(f"❌ Failed: {script} (exit {result.returncode})")
                  failed.append(script)

          if failed:
              print(f"\n❌ {len(failed)} script(s) failed: {', '.join(failed)}")
              sys.exit(1)

          print(f"\n✅ All {len(entries)} Python script(s) ran successfully.")
          PYEOF

      - name: Check for feed changes
        id: feed_changes
        run: |
          CHANGED=false

          # ── 1. XML changes (modified / added / deleted / untracked) ───────
          XML_CHANGES=$(git status --porcelain -- '*.xml')
          if [ -n "$XML_CHANGES" ]; then
            echo "Detected XML changes:"
            echo "$XML_CHANGES"
            CHANGED=true
          fi

          # ── 2. Missing expected JSON outputs (first run / manual deletion) ─
          if [ "$CHANGED" = "false" ] && [ -f feeds.json ]; then
            MISSING=$(python - <<'PYEOF'
          import json, os
          try:
              with open('feeds.json') as f:
                  feeds = json.load(f)
              missing = [f"json/{e['filename']}" for e in feeds
                         if not os.path.exists(f"json/{e['filename']}")]
              if missing:
                  print('\n'.join(missing))
          except Exception:
              pass
          PYEOF
            )
            if [ -n "$MISSING" ]; then
              echo "Missing JSON outputs (will regenerate):"
              echo "$MISSING"
              CHANGED=true
            fi
          fi

          # ── 3. Missing TTS state (force rebuild so state can be reseeded) ─
          if [ ! -f json/.tts_state.json ]; then
            echo "TTS state missing — will rebuild on this run."
            CHANGED=true
          fi

          if [ "$CHANGED" = "false" ]; then
            echo "No feed changes — convert / TTS / translation will be skipped."
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.feed_changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Convert RSS feeds to JSON
        if: steps.feed_changes.outputs.changed == 'true'
        run: |
          mkdir -p json
          npm init -y
          npm install xml2js

          cat > convert.js << 'EOF'
          const xml2js = require('xml2js');
          const fs = require('fs');
          const parser = new xml2js.Parser({ explicitArray: false });

          if (!fs.existsSync('feeds.json')) {
            console.error('❌ feeds.json not found in repository root. Aborting.');
            process.exit(1);
          }
          const feeds = JSON.parse(fs.readFileSync('feeds.json', 'utf8'));
          if (!Array.isArray(feeds) || feeds.length === 0) {
            console.error('❌ feeds.json must contain a non-empty array of { path, filename } objects.');
            process.exit(1);
          }

          function escapeBareAmpersands(xml) {
            const parts = xml.split(/(<!\[CDATA\[[\s\S]*?\]\]>)/);
            return parts.map((part, i) => {
              if (i % 2 === 1) return part;
              return part.replace(
                /&(?!(?:amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);)/g,
                '&amp;'
              );
            }).join('');
          }

          // Move ONLY the FIRST <img src="..."> out of description into a
          // dedicated `image` field. Any additional <img> tags remain in the
          // description untouched. The regex is intentionally NON-GLOBAL.
          function extractImageFromDescription(item) {
            if (!item || typeof item.description !== 'string') return item;
            const imgRegex = /<img\b[^>]*?\bsrc\s*=\s*(?:"([^"]*)"|'([^']*)')[^>]*\/?>/i;
            const match = item.description.match(imgRegex);
            if (!match) return item;

            const imageUrl = match[1] !== undefined ? match[1] : match[2];
            if (!imageUrl) return item;

            let newDesc = item.description.replace(imgRegex, '');
            newDesc = newDesc.replace(/^(?:\s|<br\s*\/?>)+/i, '').trim();

            const newItem = {};
            if (item.title !== undefined) newItem.title = item.title;
            if (item.link  !== undefined) newItem.link  = item.link;
            newItem.image = imageUrl;
            for (const key of Object.keys(item)) {
              if (['title', 'link', 'description'].includes(key)) continue;
              newItem[key] = item[key];
            }
            newItem.description = newDesc;
            return newItem;
          }

          function normalizeAndProcess(result) {
            const channel = result?.rss?.channel;
            if (!channel || !channel.item) return result;
            if (!Array.isArray(channel.item)) {
              channel.item = [channel.item];
            }
            channel.item = channel.item.map(extractImageFromDescription);
            return result;
          }

          async function convertFeed(feed) {
            const jsonPath = `json/${feed.filename}`;
            try {
              console.log(`Reading: ${feed.path}`);
              const xmlContent = fs.readFileSync(feed.path, 'utf8');
              const cleanedXml = escapeBareAmpersands(xmlContent);
              let result = await parser.parseStringPromise(cleanedXml);
              result = normalizeAndProcess(result);
              fs.writeFileSync(jsonPath, JSON.stringify(result, null, 2));
              console.log(`✅ Saved: ${jsonPath}`);
            } catch (error) {
              console.error(`❌ Error processing ${feed.path}:`, error.message);
              const fallback = { error: `Failed to read: ${error.message}`, timestamp: new Date().toISOString() };
              fs.writeFileSync(jsonPath, JSON.stringify(fallback, null, 2));
              console.log(`⚠️  Fallback written: ${jsonPath}`);
            }
          }
          async function processAllFeeds() {
            await Promise.all(feeds.map(feed => convertFeed(feed)));
            console.log('All feeds processed!');
          }
          processAllFeeds();
          EOF

          node convert.js

      - name: Generate TTS (incremental) + write tts URL into each JSON item
        if: steps.feed_changes.outputs.changed == 'true'
        run: |
          python - <<'EOF'
          import os, json, re, subprocess, glob, hashlib
          from urllib.parse import quote

          out_dir = "json/tts"
          os.makedirs(out_dir, exist_ok=True)
          state_file = "json/.tts_state.json"
          json_files = sorted(glob.glob("json/*.json"))
          base_url = "https://raw.githubusercontent.com/loserbadbakht-wq/sh/refs/heads/main/json/tts/"

          if not json_files:
              print("No JSON files found in json/")
              exit(0)

          # ── Load previous state (guid -> {file, hash}) ────────────────────
          if os.path.exists(state_file):
              with open(state_file, 'r', encoding='utf-8') as f:
                  state = json.load(f)
              # Migrate old string-only format if present
              for k, v in list(state.items()):
                  if isinstance(v, str):
                      state[k] = {"file": v, "hash": ""}
              print(f"Loaded TTS state: {len(state)} known items")
          else:
              state = {}
              print("No previous TTS state — fresh build")

          def clean_text(text):
              return re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', text)).strip()

          def sanitize_filename(title):
              title = re.sub(r'[\\/*?:"<>|]', '', title)
              title = re.sub(r'[-\s]+', '_', title)
              title = title.strip('_.')
              if len(title) > 50:
                  title = title[:50]
              return title or "untitled"

          def item_key(item):
              return item.get('guid') or item.get('link') or item.get('title', '')

          def item_hash(item):
              h = hashlib.sha256()
              h.update(str(item.get('title', '')).encode('utf-8'))
              h.update(b'\x00')
              h.update(str(item.get('description', '')).encode('utf-8'))
              return h.hexdigest()

          # Seed used_names from state so new items don't collide with
          # filenames already in use by earlier runs.
          used_names = set(v.get('file', '') for v in state.values() if v.get('file'))

          mappings = {}   # (json_path, idx) -> mp3 filename
          current_keys = set()
          stats = {"reused": 0, "generated": 0, "skipped": 0}

          # ── Pass 1: generate only NEW / CHANGED items ─────────────────────
          for json_path in json_files:
              print(f"\nProcessing {json_path}")
              with open(json_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)

              items = data.get('rss', {}).get('channel', {}).get('item', [])
              if isinstance(items, dict):
                  items = [items]
              if not items:
                  print(f"  No items in {json_path}, skipping.")
                  continue

              for idx, item in enumerate(items):
                  key = item_key(item)
                  if not key:
                      stats["skipped"] += 1
                      continue
                  current_keys.add(key)

                  current_hash = item_hash(item)
                  prev = state.get(key)

                  # Reuse if same guid AND same source content AND file exists
                  if (prev and prev.get('hash') == current_hash
                          and os.path.exists(os.path.join(out_dir, prev.get('file', '')))):
                      mappings[(json_path, idx)] = prev['file']
                      stats["reused"] += 1
                      continue

                  desc = item.get('description', '')
                  if not desc:
                      print(f"  Item {idx}: no description, skipping")
                      stats["skipped"] += 1
                      continue

                  title = item.get('title', f'item_{idx:03d}')
                  base_name = sanitize_filename(title)

                  final_name = base_name
                  if final_name in used_names:
                      counter = 1
                      while f"{base_name}_{counter}" in used_names:
                          counter += 1
                      final_name = f"{base_name}_{counter}"
                  used_names.add(final_name)

                  mp3_filename = f"{final_name}.mp3"
                  filepath = os.path.join(out_dir, mp3_filename)
                  print(f"  Generating: {filepath} (description length: {len(desc)})")
                  clean_desc = clean_text(desc)[:5000] + ("..." if len(desc) > 5000 else "")

                  try:
                      subprocess.run([
                          "edge-tts", "--text", clean_desc,
                          "--write-media", filepath,
                          "--voice", "en-US-JennyNeural"
                      ], check=True, capture_output=True, text=True)
                      print(f"  ✅ Generated: {filepath}")
                      mappings[(json_path, idx)] = mp3_filename
                      state[key] = {"file": mp3_filename, "hash": current_hash}
                      stats["generated"] += 1
                  except subprocess.CalledProcessError as e:
                      print(f"  ❌ Error for item {idx}: {e.stderr}")
                      stats["skipped"] += 1

          # ── Orphan cleanup: drop state entries + mp3s no longer referenced ─
          orphans_removed = 0
          for key in list(state.keys()):
              if key not in current_keys:
                  orphan_file = state[key].get('file', '')
                  if orphan_file:
                      orphan_path = os.path.join(out_dir, orphan_file)
                      if os.path.exists(orphan_path):
                          os.remove(orphan_path)
                  del state[key]
                  orphans_removed += 1

          if orphans_removed:
              print(f"\n🗑️  Removed {orphans_removed} orphaned item(s)")

          # ── Persist state ─────────────────────────────────────────────────
          with open(state_file, 'w', encoding='utf-8') as f:
              json.dump(state, f, indent=2, sort_keys=True)

          # ── Pass 2: stamp `tts` URL back into every JSON item ─────────────
          print("\n--- Writing tts URLs into JSON ---")
          for json_path in json_files:
              with open(json_path, 'r', encoding='utf-8') as f:
                  data = json.load(f)

              items = data.get('rss', {}).get('channel', {}).get('item', [])
              if isinstance(items, dict):
                  items = [items]
              if not items:
                  continue

              for idx, item in enumerate(items):
                  mp3 = mappings.get((json_path, idx))
                  if mp3:
                      item['tts'] = base_url + quote(mp3, safe='')

              with open(json_path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
              print(f"  ✅ Updated: {json_path}")

          print(f"\n📊 TTS summary: {stats['generated']} generated, "
                f"{stats['reused']} reused, {stats['skipped']} skipped")
          EOF

      - name: Run translation (incremental)
        if: steps.feed_changes.outputs.changed == 'true'
        env:
          TARGET_LANG: 'fa'
        run: |
          cat > translate_feeds.py << 'EOF'
          import json, os, glob, time, re, hashlib
          from googletrans import Translator

          SOURCE_DIR = 'json'
          OUTPUT_DIR = 'json/translated'
          TARGET_LANG = os.getenv('TARGET_LANG', 'es')
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          MAX_CHUNK = 4000


          def _safe_str(value, fallback):
              return value if isinstance(value, str) and value else fallback


          def item_key(item):
              return item.get('guid') or item.get('link') or item.get('title', '')


          def item_hash(item):
              h = hashlib.sha256()
              h.update(str(item.get('title', '')).encode('utf-8'))
              h.update(b'\x00')
              h.update(str(item.get('description', '')).encode('utf-8'))
              return h.hexdigest()


          def translate_text(text, translator, retries=3):
              if not text or not isinstance(text, str):
                  return _safe_str(text, "")

              stripped = text.strip()
              if not stripped:
                  return text

              total_alpha = sum(1 for c in stripped if c.isalpha())
              latin_alpha = sum(1 for c in stripped if c.isascii() and c.isalpha())
              is_likely_translated = (
                  total_alpha == 0
                  or len(stripped) < 20
                  or (latin_alpha / total_alpha) < 0.3
              )

              for attempt in range(retries):
                  try:
                      result = translator.translate(text, dest=TARGET_LANG)
                      translated = getattr(result, 'text', None)
                      if not isinstance(translated, str):
                          translated = text

                      if (not is_likely_translated
                              and translated.strip() == stripped
                              and attempt < retries - 1):
                          print(f"    ⚠️  Silent failure (unchanged), retry {attempt+1}/{retries}")
                          time.sleep(2 ** attempt)
                          continue
                      return translated
                  except Exception as e:
                      print(f"    ❌ Translation error (attempt {attempt+1}/{retries}): {e}")
                      time.sleep(2 ** attempt)

              return _safe_str(text, "")


          def split_with_seps(text, max_len=MAX_CHUNK):
              if len(text) <= max_len:
                  return [(text, '')]

              result = []
              remaining = text

              while len(remaining) > max_len:
                  window = remaining[:max_len]

                  matches = list(re.finditer(r'([.!?])(\s)', window))
                  if matches and matches[-1].end() > max_len // 2:
                      m = matches[-1]
                      result.append((remaining[:m.end() - 1], m.group(2)))
                      remaining = remaining[m.end():]
                      continue

                  space_pos = window.rfind(' ')
                  if space_pos > max_len // 4:
                      result.append((remaining[:space_pos], ' '))
                      remaining = remaining[space_pos + 1:]
                      continue

                  result.append((remaining[:max_len], ''))
                  remaining = remaining[max_len:]

              if remaining:
                  result.append((remaining, ''))
              return result


          def translate_long(text, translator):
              if not text or not isinstance(text, str):
                  return _safe_str(text, "")
              if len(text) <= MAX_CHUNK:
                  return translate_text(text, translator)

              parts = re.split(r'(<br\s*/?>)', text, flags=re.IGNORECASE)

              result = []
              buffer = ''

              for i, part in enumerate(parts):
                  if part is None:
                      continue
                  if i % 2 == 1:
                      for chunk, sep in split_with_seps(buffer, MAX_CHUNK):
                          result.append(translate_text(chunk, translator) + sep)
                      buffer = ''
                      result.append(part)
                  else:
                      buffer += part

              if buffer:
                  for chunk, sep in split_with_seps(buffer, MAX_CHUNK):
                      result.append(translate_text(chunk, translator) + sep)

              return ''.join(result)


          def load_previous_translated(output_path):
              """Return {guid: item} from a previous run, or {} if unavailable."""
              if not os.path.exists(output_path):
                  return {}
              try:
                  with open(output_path, 'r', encoding='utf-8') as f:
                      prev = json.load(f)
              except Exception:
                  return {}
              channel = prev.get('rss', {}).get('channel', {})
              items = channel.get('item', [])
              if isinstance(items, dict):
                  items = [items]
              result = {}
              for item in items:
                  key = item_key(item)
                  if key:
                      result[key] = item
              return result


          def translate_feed_incremental(data, translator, previous_items):
              """Translate only new/changed items; reuse the rest."""
              channel = data.get('rss', {}).get('channel', {})
              if not channel:
                  return data, {"reused": 0, "translated": 0}

              stats = {"reused": 0, "translated": 0}

              # Channel title/description — always retranslate (cheap: 2 calls).
              # googletrans is deterministic for same input, so unchanged source
              # produces byte-identical output and doesn't create a commit diff.
              if 'title' in channel:
                  channel['title'] = translate_text(channel['title'], translator)
              if 'description' in channel:
                  channel['description'] = translate_long(channel['description'], translator)

              items = channel.get('item', [])
              if isinstance(items, dict):
                  items = [items]
                  channel['item'] = items

              for idx, item in enumerate(items):
                  key = item_key(item)
                  current_hash = item_hash(item)

                  prev = previous_items.get(key)
                  if prev and prev.get('_source_hash') == current_hash:
                      # Same guid AND same source content → reuse translation.
                      # Only copy translated fields; everything else (tts, image,
                      # link, guid, pubDate) already exists in current item.
                      if 'title' in prev:
                          item['title'] = prev['title']
                      if 'description' in prev:
                          item['description'] = prev['description']
                      item['_source_hash'] = current_hash
                      stats["reused"] += 1
                      continue

                  # Fresh translation
                  if 'title' in item:
                      item['title'] = translate_text(item['title'], translator)
                  if 'description' in item:
                      desc = item['description']
                      if isinstance(desc, str) and len(desc) > MAX_CHUNK:
                          print(f"  Item {idx}: long description ({len(desc)} chars) → chunking")
                      item['description'] = translate_long(desc, translator)
                  item['_source_hash'] = current_hash
                  stats["translated"] += 1
                  time.sleep(0.3)

              return data, stats


          def main():
              if not os.path.isdir(SOURCE_DIR):
                  print(f"Source folder '{SOURCE_DIR}' does not exist.")
                  return
              json_files = sorted(glob.glob(os.path.join(SOURCE_DIR, '*.json')))
              if not json_files:
                  print(f"No JSON files found in '{SOURCE_DIR}'.")
                  return

              translator = Translator()
              grand = {"reused": 0, "translated": 0}

              for file_path in json_files:
                  filename = os.path.basename(file_path)
                  output_path = os.path.join(OUTPUT_DIR, filename)
                  print(f"\n--- Processing: {filename} ---")

                  previous_items = load_previous_translated(output_path)

                  with open(file_path, 'r', encoding='utf-8') as f:
                      data = json.load(f)

                  translated_data, stats = translate_feed_incremental(
                      data, translator, previous_items
                  )
                  grand["reused"] += stats["reused"]
                  grand["translated"] += stats["translated"]

                  # Only update the timestamp if something actually translated;
                  # otherwise the file stays byte-identical and no commit is made.
                  if stats["translated"] > 0:
                      translated_data['_translated_at'] = time.strftime(
                          '%Y-%m-%dT%H:%M:%SZ', time.gmtime()
                      )
                  elif os.path.exists(output_path):
                      try:
                          with open(output_path, 'r', encoding='utf-8') as f:
                              prev_ts = json.load(f).get('_translated_at')
                          if prev_ts:
                              translated_data['_translated_at'] = prev_ts
                      except Exception:
                          pass

                  with open(output_path, 'w', encoding='utf-8') as f:
                      json.dump(translated_data, f, indent=2, ensure_ascii=False)
                  print(f"  ✅ Saved: {output_path} "
                        f"({stats['translated']} new, {stats['reused']} reused)")

              print(f"\n📊 Translation summary: {grand['translated']} translated, "
                    f"{grand['reused']} reused")


          if __name__ == "__main__":
              main()
          EOF

          python translate_feeds.py

      - name: Show git status (debug)
        run: git status --porcelain

      - name: Commit and push all changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update RSS, translations and TTS [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          # push_options: '--force'  ← removed per Fix 1
