name: Generate RSS, JSON, TTS and Translations

on:
  push:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: fetch-rss-convert
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # googletrans 4.0.2 is the latest official release and fixes the
          # 'Translator' object has no attribute 'raise_Exception' bug that
          # the old 4.0.0-rc1 pre-release hits on failure paths.
          python -m pip install edge-tts requests googletrans==4.0.2

      - name: Generate rss (Python scripts from pythons.json)
        env:
          BA: ${{ secrets.BA }}
          BI: ${{ secrets.BI }}
        run: |
          python - <<'PYEOF'
          import json, os, subprocess, sys

          if not os.path.exists('pythons.json'):
              print("❌ pythons.json not found in repository root. Aborting.")
              sys.exit(1)

          with open('pythons.json', 'r', encoding='utf-8') as f:
              entries = json.load(f)

          if not isinstance(entries, list) or not entries:
              print("❌ pythons.json must contain a non-empty array of "
                    "{ script, env? } objects.")
              sys.exit(1)

          failed = []

          for i, entry in enumerate(entries):
              if not isinstance(entry, dict) or 'script' not in entry:
                  print(f"❌ pythons.json entry #{i} missing 'script' key.")
                  sys.exit(1)

              script = entry['script']
              env_map = entry.get('env', {}) or {}

              env = os.environ.copy()
              for env_var, secret_name in env_map.items():
                  secret_val = os.environ.get(secret_name)
                  if secret_val is None:
                      print(f"❌ Missing secret env '{secret_name}' "
                            f"(required as '{env_var}' for {script}).")
                      sys.exit(1)
                  env[env_var] = secret_val

              print(f"\n▶ Running {script}")
              result = subprocess.run([sys.executable, script], env=env)
              if result.returncode != 0:
                  print(f"❌ Failed: {script} (exit {result.returncode})")
                  failed.append(script)

          if failed:
              print(f"\n❌ {len(failed)} script(s) failed: {', '.join(failed)}")
              sys.exit(1)

          print(f"\n✅ All {len(entries)} Python script(s) ran successfully.")
          PYEOF

      - name: Check for feed changes
        id: feed_changes
        run: |
          CHANGED=false

          XML_CHANGES=$(git status --porcelain -- '*.xml')
          if [ -n "$XML_CHANGES" ]; then
            echo "Detected XML changes:"
            echo "$XML_CHANGES"
            CHANGED=true
          fi

          if [ "$CHANGED" = "false" ] && [ -f feeds.json ]; then
            MISSING=$(python - <<'PYEOF'
          import json, os
          try:
              with open('feeds.json') as f:
                  feeds = json.load(f)
              missing = [f"json/{e['filename']}" for e in feeds
                         if not os.path.exists(f"json/{e['filename']}")]
              if missing:
                  print('\n'.join(missing))
          except Exception:
              pass
          PYEOF
            )
            if [ -n "$MISSING" ]; then
              echo "Missing JSON outputs (will regenerate):"
              echo "$MISSING"
              CHANGED=true
            fi
          fi

          if [ ! -f json/.tts_state.json ]; then
            echo "TTS state missing — will rebuild on this run."
            CHANGED=true
          fi

          if [ "$CHANGED" = "false" ]; then
            echo "No feed changes — convert / TTS / translation will be skipped."
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Detect unexpected deletions before commit
        if: steps.feed_changes.outputs.changed == 'true'
        run: |
          MANAGED='^(json/|safebooru/|notif/|Gen/|never/).*|^[^/]+\.xml$|^[^/]+\.jpg$|^[^/]+\.png$'
          UNEXPECTED=$(git status --porcelain | awk '/^ D / {print $2}' | grep -vE "$MANAGED" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "⚠️  Unexpected deletions found — restoring from HEAD:"
            echo "$UNEXPECTED"
            echo "$UNEXPECTED" | while IFS= read -r f; do
              [ -n "$f" ] && git checkout -- "$f" 2>/dev/null || true
            done
            echo "Restored. These files will NOT be committed as deleted."
          else
            echo "No unexpected deletions."
          fi

      - name: Setup Node.js
        if: steps.feed_changes.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Convert RSS feeds to JSON
        if: steps.feed_changes.outputs.changed == 'true'
        run: |
          mkdir -p json
          npm init -y
          npm install xml2js

          cat > convert.js << 'EOF'
          const xml2js = require('xml2js');
          const fs = require('fs');
          const parser = new xml2js.Parser({ explicitArray: false });

          if (!fs.existsSync('feeds.json')) {
            console.error('❌ feeds.json not found in repository root. Aborting.');
            process.exit(1);
          }
          const feeds = JSON.parse(fs.readFileSync('feeds.json', 'utf8'));
          if (!Array.isArray(feeds) || feeds.length === 0) {
            console.error('❌ feeds.json must contain a non-empty array of { path, filename } objects.');
            process.exit(1);
          }

          function wrapDescriptionsInCDATA(xml) {
            const tagPattern = /<(description|content:encoded)>([\s\S]*?)<\/\1>/gi;
            return xml.replace(tagPattern, (match, tagName, content) => {
              if (content.includes('<![CDATA[')) {
                return match;
              }
              const safeContent = content.replace(/]]>/g, ']]]]><![CDATA[>');
              return `<${tagName}><![CDATA[${safeContent}]]></${tagName}>`;
            });
          }

          function escapeBareAmpersands(xml) {
            const parts = xml.split(/(<!\[CDATA\[[\s\S]*?\]\]>)/);
            return parts.map((part, i) => {
              if (i % 2 === 1) return part;
              return part.replace(
                /&(?!(?:amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);)/g,
                '&amp;'
              );
            }).join('');
          }

          function coerceToString(value) {
            if (value === undefined || value === null) return '';
            if (typeof value === 'string') return value;
            if (typeof value === 'number' || typeof value === 'boolean') return String(value);
            if (Array.isArray(value)) return value.map(coerceToString).join(' ').trim();
            if (typeof value === 'object') {
              let out = '';
              if (typeof value._ === 'string') out += value._;
              for (const key of Object.keys(value)) {
                if (key === '_' || key === '$') continue;
                const sub = coerceToString(value[key]);
                if (sub) out += ' ' + sub;
              }
              return out.trim();
            }
            return String(value);
          }

          function coerceItemFields(item) {
            if (!item || typeof item !== 'object' || Array.isArray(item)) return item;
            for (const field of ['title', 'link', 'guid', 'pubDate', 'description', 'image']) {
              if (item[field] !== undefined && typeof item[field] !== 'string') {
                item[field] = coerceToString(item[field]);
              }
            }
            return item;
          }

          function extractImageFromDescription(item) {
            if (!item || typeof item.description !== 'string') return item;
            const imgRegex = /<img\b[^>]*?\bsrc\s*=\s*(?:"([^"]*)"|'([^']*)')[^>]*\/?>/i;
            const match = item.description.match(imgRegex);
            if (!match) return item;

            const imageUrl = match[1] !== undefined ? match[1] : match[2];
            if (!imageUrl) return item;

            let newDesc = item.description.replace(imgRegex, '');
            newDesc = newDesc.replace(/^(?:\s|<br\s*\/?>)+/i, '').trim();

            const newItem = {};
            if (item.title !== undefined) newItem.title = item.title;
            if (item.link  !== undefined) newItem.link  = item.link;
            newItem.image = imageUrl;
            for (const key of Object.keys(item)) {
              if (['title', 'link', 'description'].includes(key)) continue;
              newItem[key] = item[key];
            }
            newItem.description = newDesc;
            return newItem;
          }

          function normalizeAndProcess(result) {
            if (!result || typeof result !== 'object') return result;
            const channel = result?.rss?.channel;
            if (!channel || typeof channel !== 'object') return result;
            if (!channel.item) return result;
            if (!Array.isArray(channel.item)) {
              channel.item = [channel.item];
            }
            channel.item = channel.item
              .filter(it => it && typeof it === 'object' && !Array.isArray(it))
              .map(coerceItemFields)
              .map(extractImageFromDescription);
            return result;
          }

          async function convertFeed(feed) {
            const jsonPath = `json/${feed.filename}`;
            try {
              console.log(`Reading: ${feed.path}`);
              const rawXml = fs.readFileSync(feed.path, 'utf8');
              const cdataXml = wrapDescriptionsInCDATA(rawXml);
              const cleanedXml = escapeBareAmpersands(cdataXml);
              let result = await parser.parseStringPromise(cleanedXml);
              result = normalizeAndProcess(result);
              fs.writeFileSync(jsonPath, JSON.stringify(result, null, 2));
              console.log(`✅ Saved: ${jsonPath}`);
            } catch (error) {
              console.error(`❌ Error processing ${feed.path}:`, error.message);
              const fallback = { error: `Failed to read: ${error.message}`, timestamp: new Date().toISOString() };
              fs.writeFileSync(jsonPath, JSON.stringify(fallback, null, 2));
              console.log(`⚠️  Fallback written: ${jsonPath}`);
            }
          }
          async function processAllFeeds() {
            await Promise.all(feeds.map(feed => convertFeed(feed)));
            console.log('All feeds processed!');
          }
          processAllFeeds();
          EOF

          node convert.js

      - name: Generate TTS (incremental) + write tts URL into each JSON item
        if: steps.feed_changes.outputs.changed == 'true'
        run: |
          python - <<'EOF'
          import os, sys, json, re, subprocess, glob, hashlib
          from urllib.parse import quote

          out_dir = "json/tts"
          os.makedirs(out_dir, exist_ok=True)
          state_file = "json/.tts_state.json"
          json_files = sorted(glob.glob("json/*.json"))
          base_url = "https://raw.githubusercontent.com/loserbadbakht-wq/sh/refs/heads/main/json/tts/"

          if not json_files:
              print("No JSON files found in json/")
              sys.exit(0)

          def coerce_to_str(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, (int, float, bool)):
                  return str(value)
              if isinstance(value, list):
                  return " ".join(coerce_to_str(v) for v in value).strip()
              if isinstance(value, dict):
                  parts = []
                  if isinstance(value.get('_'), str):
                      parts.append(value['_'])
                  for k, v in value.items():
                      if k in ('_', '$'):
                          continue
                      s = coerce_to_str(v)
                      if s:
                          parts.append(s)
                  return " ".join(parts).strip()
              return str(value)

          def load_items(json_path):
              try:
                  with open(json_path, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"  ❌ Cannot read {json_path}: {e}")
                  return None

              if not isinstance(data, dict):
                  print(f"  ⚠️  {json_path} root is not an object, skipping.")
                  return None
              if 'error' in data:
                  print(f"  ⚠️  {json_path} is an error fallback, skipping.")
                  return None

              rss = data.get('rss', {})
              if not isinstance(rss, dict):
                  print(f"  ⚠️  {json_path} 'rss' is not an object, skipping.")
                  return None
              channel = rss.get('channel', {})
              if not isinstance(channel, dict):
                  print(f"  ⚠️  {json_path} 'channel' is not an object, skipping.")
                  return None

              items = channel.get('item', [])
              if isinstance(items, dict):
                  items = [items]
              if not isinstance(items, list):
                  print(f"  ⚠️  {json_path} 'item' is not a list, skipping.")
                  return None
              return [it for it in items if isinstance(it, dict)]

          def clean_text(text):
              return re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', text)).strip()

          def sanitize_filename(title):
              title = re.sub(r'[\\/*?:"<>|]', '', title)
              title = re.sub(r'[-\s]+', '_', title)
              title = title.strip('_.')
              if len(title) > 50:
                  title = title[:50]
              return title or "untitled"

          def item_key(item):
              return (coerce_to_str(item.get('guid'))
                      or coerce_to_str(item.get('link'))
                      or coerce_to_str(item.get('title')))

          def item_hash(item):
              h = hashlib.sha256()
              h.update(coerce_to_str(item.get('title')).encode('utf-8'))
              h.update(b'\x00')
              h.update(coerce_to_str(item.get('description')).encode('utf-8'))
              return h.hexdigest()

          if os.path.exists(state_file):
              try:
                  with open(state_file, 'r', encoding='utf-8') as f:
                      state = json.load(f)
                  if not isinstance(state, dict):
                      raise ValueError("state root is not an object")
                  for k, v in list(state.items()):
                      if isinstance(v, str):
                          state[k] = {"file": v, "hash": ""}
                      elif not isinstance(v, dict):
                          del state[k]
                  print(f"Loaded TTS state: {len(state)} known items")
              except Exception as e:
                  print(f"⚠️  Could not load TTS state ({e}) — starting fresh")
                  state = {}
          else:
              state = {}
              print("No previous TTS state — fresh build")

          used_names = set(
              v.get('file', '') for v in state.values()
              if isinstance(v, dict) and v.get('file')
          )

          mappings = {}
          stats = {"reused": 0, "generated": 0, "skipped": 0}
          files_ok = 0
          files_failed = 0

          for json_path in json_files:
              print(f"\nProcessing {json_path}")
              items = load_items(json_path)
              if items is None:
                  files_failed += 1
                  continue
              if not items:
                  print(f"  No items in {json_path}, skipping.")
                  files_ok += 1
                  continue

              try:
                  for idx, item in enumerate(items):
                      try:
                          key = item_key(item)
                          if not key:
                              stats["skipped"] += 1
                              continue

                          current_hash = item_hash(item)
                          prev = state.get(key)

                          prev_file = prev.get('file') if isinstance(prev, dict) else None
                          if (isinstance(prev_file, str) and prev_file
                                  and prev.get('hash') == current_hash
                                  and os.path.exists(os.path.join(out_dir, prev_file))):
                              mappings[(json_path, idx)] = prev_file
                              stats["reused"] += 1
                              continue

                          desc = coerce_to_str(item.get('description'))
                          if not desc:
                              stats["skipped"] += 1
                              continue

                          clean_desc = clean_text(desc)[:5000]
                          if len(desc) > 5000:
                              clean_desc += "..."
                          if not clean_desc:
                              print(f"  Item {idx}: empty after cleaning, skipping")
                              stats["skipped"] += 1
                              continue

                          title = coerce_to_str(item.get('title')) or f'item_{idx:03d}'
                          base_name = sanitize_filename(title)

                          final_name = base_name
                          if final_name in used_names:
                              counter = 1
                              while f"{base_name}_{counter}" in used_names:
                                  counter += 1
                              final_name = f"{base_name}_{counter}"
                          used_names.add(final_name)

                          mp3_filename = f"{final_name}.mp3"
                          filepath = os.path.join(out_dir, mp3_filename)
                          print(f"  Generating: {filepath} (length: {len(desc)})")

                          subprocess.run([
                              "edge-tts", "--text", clean_desc,
                              "--write-media", filepath,
                              "--voice", "en-US-JennyNeural"
                          ], check=True, capture_output=True, text=True, timeout=120)

                          print(f"  ✅ Generated: {filepath}")
                          mappings[(json_path, idx)] = mp3_filename
                          state[key] = {"file": mp3_filename, "hash": current_hash}
                          stats["generated"] += 1

                      except subprocess.TimeoutExpired:
                          print(f"  ❌ Item {idx}: edge-tts timed out after 120s")
                          stats["skipped"] += 1
                      except subprocess.CalledProcessError as e:
                          print(f"  ❌ Item {idx}: edge-tts failed ({e.returncode})")
                          if e.stderr:
                              print(f"     {e.stderr.strip()[:300]}")
                          stats["skipped"] += 1
                      except Exception as e:
                          print(f"  ❌ Item {idx}: {type(e).__name__}: {e}")
                          stats["skipped"] += 1
                          continue

                  files_ok += 1
              except Exception as e:
                  print(f"  ❌ File-level error on {json_path}: {e}")
                  files_failed += 1

          try:
              with open(state_file, 'w', encoding='utf-8') as f:
                  json.dump(state, f, indent=2, sort_keys=True)
          except Exception as e:
              print(f"⚠️  Could not write state file: {e}")

          print("\n--- Writing tts URLs into JSON ---")
          for json_path in json_files:
              try:
                  with open(json_path, 'r', encoding='utf-8') as f:
                      data = json.load(f)
                  items = data.get('rss', {}).get('channel', {}).get('item', [])
                  if isinstance(items, dict):
                      items = [items]
                  if not isinstance(items, list):
                      continue

                  for idx, item in enumerate(items):
                      if not isinstance(item, dict):
                          continue
                      mp3 = mappings.get((json_path, idx))
                      if mp3:
                          item['tts'] = base_url + quote(mp3, safe='')

                  with open(json_path, 'w', encoding='utf-8') as f:
                      json.dump(data, f, indent=2, ensure_ascii=False)
                  print(f"  ✅ Updated: {json_path}")
              except Exception as e:
                  print(f"  ⚠️  Could not stamp tts URLs into {json_path}: {e}")

          print(f"\n📊 TTS summary: {stats['generated']} generated, "
                f"{stats['reused']} reused, {stats['skipped']} skipped, "
                f"{files_ok} file(s) ok, {files_failed} failed")

          if files_ok == 0 and files_failed > 0:
              print("\n❌ All files failed — exiting non-zero.")
              sys.exit(1)
          elif files_failed > 0:
              print(f"\n⚠️  {files_failed} file(s) failed but "
                    f"{files_ok} succeeded — continuing.")
          EOF

      - name: Run translation (incremental)
        if: steps.feed_changes.outputs.changed == 'true'
        env:
          TARGET_LANG: 'fa'
        run: |
          cat > translate_feeds.py << 'EOF'
          import json, os, glob, time, re, hashlib, sys
          from googletrans import Translator

          SOURCE_DIR = 'json'
          OUTPUT_DIR = 'json/translated'
          TARGET_LANG = os.getenv('TARGET_LANG', 'es')
          os.makedirs(OUTPUT_DIR, exist_ok=True)

          MAX_CHUNK = 4000


          def coerce_to_str(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, (int, float, bool)):
                  return str(value)
              if isinstance(value, list):
                  return " ".join(coerce_to_str(v) for v in value).strip()
              if isinstance(value, dict):
                  parts = []
                  if isinstance(value.get('_'), str):
                      parts.append(value['_'])
                  for k, v in value.items():
                      if k in ('_', '$'):
                          continue
                      s = coerce_to_str(v)
                      if s:
                          parts.append(s)
                  return " ".join(parts).strip()
              return str(value)


          def item_key(item):
              if not isinstance(item, dict):
                  return ""
              return (coerce_to_str(item.get('guid'))
                      or coerce_to_str(item.get('link'))
                      or coerce_to_str(item.get('title')))


          def item_hash(item):
              if not isinstance(item, dict):
                  return ""
              h = hashlib.sha256()
              h.update(coerce_to_str(item.get('title')).encode('utf-8'))
              h.update(b'\x00')
              h.update(coerce_to_str(item.get('description')).encode('utf-8'))
              return h.hexdigest()


          def _safe_str(value, fallback):
              return value if isinstance(value, str) and value else fallback


          def translate_text(text, translator, retries=3):
              text = coerce_to_str(text)
              if not text:
                  return ""
              stripped = text.strip()
              if not stripped:
                  return text

              total_alpha = sum(1 for c in stripped if c.isalpha())
              latin_alpha = sum(1 for c in stripped if c.isascii() and c.isalpha())
              is_likely_translated = (
                  total_alpha == 0
                  or len(stripped) < 20
                  or (latin_alpha / total_alpha) < 0.3
              )

              for attempt in range(retries):
                  try:
                      result = translator.translate(text, dest=TARGET_LANG)
                      translated = getattr(result, 'text', None)
                      if not isinstance(translated, str):
                          translated = text

                      if (not is_likely_translated
                              and translated.strip() == stripped
                              and attempt < retries - 1):
                          print(f"    ⚠️  Silent failure (unchanged), retry {attempt+1}/{retries}")
                          time.sleep(2 ** attempt)
                          continue
                      return translated
                  except Exception as e:
                      print(f"    ❌ Translation error (attempt {attempt+1}/{retries}): {e}")
                      time.sleep(2 ** attempt)

              return _safe_str(text, "")


          def split_with_seps(text, max_len=MAX_CHUNK):
              text = coerce_to_str(text)
              if len(text) <= max_len:
                  return [(text, '')]

              result = []
              remaining = text

              while len(remaining) > max_len:
                  window = remaining[:max_len]

                  matches = list(re.finditer(r'([.!?])(\s)', window))
                  if matches and matches[-1].end() > max_len // 2:
                      m = matches[-1]
                      result.append((remaining[:m.end() - 1], m.group(2)))
                      remaining = remaining[m.end():]
                      continue

                  space_pos = window.rfind(' ')
                  if space_pos > max_len // 4:
                      result.append((remaining[:space_pos], ' '))
                      remaining = remaining[space_pos + 1:]
                      continue

                  result.append((remaining[:max_len], ''))
                  remaining = remaining[max_len:]

              if remaining:
                  result.append((remaining, ''))
              return result


          def translate_long(text, translator):
              text = coerce_to_str(text)
              if not text:
                  return ""
              if len(text) <= MAX_CHUNK:
                  return translate_text(text, translator)

              parts = re.split(r'(<br\s*/?>)', text, flags=re.IGNORECASE)

              result = []
              buffer = ''

              for i, part in enumerate(parts):
                  if part is None:
                      continue
                  if i % 2 == 1:
                      for chunk, sep in split_with_seps(buffer, MAX_CHUNK):
                          result.append(translate_text(chunk, translator) + sep)
                      buffer = ''
                      result.append(part)
                  else:
                      buffer += part

              if buffer:
                  for chunk, sep in split_with_seps(buffer, MAX_CHUNK):
                      result.append(translate_text(chunk, translator) + sep)

              return ''.join(result)


          def load_previous_translated(output_path):
              if not os.path.exists(output_path):
                  return {}
              try:
                  with open(output_path, 'r', encoding='utf-8') as f:
                      prev = json.load(f)
              except Exception:
                  return {}
              channel = prev.get('rss', {}).get('channel', {}) if isinstance(prev, dict) else {}
              if not isinstance(channel, dict):
                  return {}
              items = channel.get('item', [])
              if isinstance(items, dict):
                  items = [items]
              if not isinstance(items, list):
                  return {}
              result = {}
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  key = item_key(item)
                  if key:
                      result[key] = item
              return result


          def translate_feed_incremental(data, translator, previous_items):
              channel = data.get('rss', {}).get('channel', {})
              if not isinstance(channel, dict):
                  return data, {"reused": 0, "translated": 0}

              stats = {"reused": 0, "translated": 0}

              try:
                  if 'title' in channel:
                      channel['title'] = translate_text(channel['title'], translator)
                  if 'description' in channel:
                      channel['description'] = translate_long(channel['description'], translator)
              except Exception as e:
                  print(f"  ⚠️  Channel-level translation failed: {e}")

              items = channel.get('item', [])
              if isinstance(items, dict):
                  items = [items]
              if not isinstance(items, list):
                  return data, stats
              channel['item'] = items

              for idx, item in enumerate(items):
                  if not isinstance(item, dict):
                      print(f"  ⚠️  Item {idx}: not an object, skipping.")
                      continue
                  try:
                      key = item_key(item)
                      current_hash = item_hash(item)

                      prev = previous_items.get(key)
                      if (isinstance(prev, dict)
                              and prev.get('_source_hash') == current_hash):
                          if 'title' in prev:
                              item['title'] = prev['title']
                          if 'description' in prev:
                              item['description'] = prev['description']
                          item['_source_hash'] = current_hash
                          stats["reused"] += 1
                          continue

                      if 'title' in item:
                          item['title'] = translate_text(item['title'], translator)
                      if 'description' in item:
                          desc = coerce_to_str(item['description'])
                          if len(desc) > MAX_CHUNK:
                              print(f"  Item {idx}: long description ({len(desc)} chars) → chunking")
                          item['description'] = translate_long(desc, translator)
                      item['_source_hash'] = current_hash
                      stats["translated"] += 1
                      time.sleep(0.3)

                  except Exception as e:
                      print(f"  ❌ Item {idx}: {type(e).__name__}: {e}")
                      continue

              return data, stats


          def load_items_from_source(file_path):
              try:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      data = json.load(f)
              except Exception as e:
                  print(f"  ❌ Cannot read {file_path}: {e}")
                  return None
              if not isinstance(data, dict):
                  print(f"  ⚠️  {file_path} root is not an object, skipping.")
                  return None
              if 'error' in data:
                  print(f"  ⚠️  {file_path} is an error fallback, skipping.")
                  return None
              return data


          def main():
              if not os.path.isdir(SOURCE_DIR):
                  print(f"Source folder '{SOURCE_DIR}' does not exist.")
                  return
              json_files = sorted(glob.glob(os.path.join(SOURCE_DIR, '*.json')))
              if not json_files:
                  print(f"No JSON files found in '{SOURCE_DIR}'.")
                  return

              translator = Translator()
              grand = {"reused": 0, "translated": 0}
              files_ok = 0
              files_failed = 0

              for file_path in json_files:
                  filename = os.path.basename(file_path)
                  output_path = os.path.join(OUTPUT_DIR, filename)
                  print(f"\n--- Processing: {filename} ---")

                  data = load_items_from_source(file_path)
                  if data is None:
                      files_failed += 1
                      continue

                  try:
                      previous_items = load_previous_translated(output_path)
                      translated_data, stats = translate_feed_incremental(
                          data, translator, previous_items
                      )
                      grand["reused"] += stats["reused"]
                      grand["translated"] += stats["translated"]

                      if stats["translated"] > 0:
                          translated_data['_translated_at'] = time.strftime(
                              '%Y-%m-%dT%H:%M:%SZ', time.gmtime()
                          )
                      elif os.path.exists(output_path):
                          try:
                              with open(output_path, 'r', encoding='utf-8') as f:
                                  prev_ts = json.load(f).get('_translated_at')
                              if prev_ts:
                                  translated_data['_translated_at'] = prev_ts
                          except Exception:
                              pass

                      with open(output_path, 'w', encoding='utf-8') as f:
                          json.dump(translated_data, f, indent=2, ensure_ascii=False)
                      print(f"  ✅ Saved: {output_path} "
                            f"({stats['translated']} new, {stats['reused']} reused)")
                      files_ok += 1

                  except Exception as e:
                      print(f"  ❌ File-level error on {filename}: {e}")
                      files_failed += 1

              print(f"\n📊 Translation summary: {grand['translated']} translated, "
                    f"{grand['reused']} reused, {files_ok} file(s) ok, "
                    f"{files_failed} failed")

              if files_ok == 0 and files_failed > 0:
                  print("\n❌ All files failed — exiting non-zero.")
                  sys.exit(1)
              elif files_failed > 0:
                  print(f"\n⚠️  {files_failed} file(s) failed but "
                        f"{files_ok} succeeded — continuing.")


          if __name__ == "__main__":
              main()
          EOF

          python translate_feeds.py

      - name: Show git status (debug)
        run: git status --porcelain

      - name: Commit and push (with retry on race)
        if: steps.feed_changes.outputs.changed == 'true'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only paths this workflow owns. Git pathspec `*` matches `/`
          # (FNM_PATHNAME unset), so `*.xml` matches XMLs at any depth. Same
          # intent as the previous `file_pattern`, but now under our control.
          git add -A -- '*.xml' '*.jpg' '*.png' 'json/' 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes staged — nothing to commit."
            exit 0
          fi

          git commit -m "Update RSS, translations and TTS [skip ci]"
          echo "✅ Commit created: $(git rev-parse --short HEAD)"

          # Retry on push race: remote `main` may move while this run is
          # building (manual push, other workflow, etc.). On rejection,
          # rebase onto latest remote and retry.
          MAX=3
          for i in $(seq 1 $MAX); do
            echo ""
            echo "Push attempt $i / $MAX"
            if git push origin HEAD:main; then
              echo "✅ Push succeeded on attempt $i"
              exit 0
            fi

            if [ "$i" = "$MAX" ]; then
              echo "❌ Push failed after $MAX attempts"
              exit 1
            fi

            echo "⚠️  Push rejected — remote moved ahead. Rebasing onto origin/main..."
            if ! git pull --rebase origin main; then
              echo "❌ Rebase failed — aborting."
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            sleep $((i * 2))
          done
