name: Fetch RSS and convert to JSON

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Extract filename and URL
        id: extract
        run: |
          URL="https://raw.githubusercontent.com/loserbadbakht-wq/sh/refs/heads/main/safebooru/safebooru-yuri-rss.xml"
          FILENAME=$(basename "$URL" .xml)
          echo "full_url=$URL" >> $GITHUB_OUTPUT
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Fetch and convert RSS
        run: |
          mkdir -p json
          npm init -y
          npm install axios xml2js
          node -e "
            const axios = require('axios');
            const xml2js = require('xml2js');
            const parser = new xml2js.Parser({ explicitArray: false });
            
            axios.get(process.env.RSS_URL)
              .then(response => {
                parser.parseString(response.data, (err, result) => {
                  if (err) {
                    console.error(err);
                    process.exit(1);
                  }
                  console.log(JSON.stringify(result, null, 2));
                });
              })
              .catch(err => {
                console.error(err);
                process.exit(1);
              });
          " > json/${{ steps.extract.outputs.filename }}.json
        env:
          RSS_URL: ${{ steps.extract.outputs.full_url }}

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/
          git diff --staged --quiet || git commit -m "Update RSS feed JSON [skip ci]"
          git push
