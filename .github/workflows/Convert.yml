name: Fetch RSS and convert to JSON

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Fetch and convert RSS feeds
        run: |
          mkdir -p json
          npm init -y
          npm install axios xml2js
          
          cat > convert.js << 'EOF'
          const axios = require('axios');
          const xml2js = require('xml2js');
          const fs = require('fs');
          const parser = new xml2js.Parser({ explicitArray: false });
          
          // Define your RSS feeds here
          const feeds = [
            {
              url: 'https://raw.githubusercontent.com/loserbadbakht-wq/sh/refs/heads/main/safebooru/safebooru-yuri-rss.xml',
              filename: 'safebooru-yuri-rss.json'
            },
            // Add more feeds here
             {
              url: 'https://raw.githubusercontent.com/loserbadbakht-wq/sh/refs/heads/main/notif/new1.xml',
              filename: 'new1.json'
             },
            // {
            //   url: 'https://example.com/feed3.xml',
            //   filename: 'feed3.json'
            // }
          ];
          
          async function fetchAndConvert(feed) {
            try {
              console.log(`Fetching: ${feed.url}`);
              const response = await axios.get(feed.url);
              const result = await parser.parseStringPromise(response.data);
              const jsonPath = `json/${feed.filename}`;
              fs.writeFileSync(jsonPath, JSON.stringify(result, null, 2));
              console.log(`✅ Saved: ${jsonPath}`);
            } catch (error) {
              console.error(`❌ Error processing ${feed.url}:`, error.message);
            }
          }
          
          async function processAllFeeds() {
            const promises = feeds.map(feed => fetchAndConvert(feed));
            await Promise.all(promises);
            console.log('All feeds processed!');
          }
          
          processAllFeeds();
          EOF
          
          node convert.js

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add json/
          git diff --staged --quiet || git commit -m "Update RSS feeds JSON [skip ci]"
          git push
